name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One build/deploy at a time; a queued run waits (never overlaps) and newer queued runs replace older pending ones.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore API cache (last good data)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Build (fails on empty/suspicious data so Pages keeps the previous deploy)
        run: python3 build.py
        timeout-minutes: 15
      - name: Save API cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
